[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dec-k"
version = "0.1.0"
description = "Diverse Evidence with Calibrated K for long-term memory multimodal agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Shidu Ren", email = "ryan.ren@mail.utoronto.ca"},
  {name = "Rongcheng Tu"},
  {name = "Hang Zhou"},
  {name = "Xiao Luo"},
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "transformers>=4.51",
]

[project.scripts]
deck = "deck.cli:main"

[project.urls]
Repository = "https://github.com/Shidu-Ren/DEC-K"
Issues = "https://github.com/Shidu-Ren/DEC-K/issues"

[tool.setuptools.packages.find]
where = ["src"]
